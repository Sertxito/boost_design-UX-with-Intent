name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce PR-only main policy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;

            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha,
            });

            if (!response.data || response.data.length === 0) {
              core.setFailed(
                `Direct push detected on main for commit ${commitSha}. ` +
                `Release workflow requires changes merged through pull request.`
              );
              return;
            }

            core.info(
              `Release policy check passed. Commit ${commitSha} is linked to PR(s): ` +
              response.data.map((pr) => `#${pr.number}`).join(", ")
            );

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate quality gates
        run: npm run quality

      - name: Validate doctor gates
        run: npm run doctor

      - name: Validate 100 coverage gate
        run: npm run coverage:gate

      - name: Run semantic release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
